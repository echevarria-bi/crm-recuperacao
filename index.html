<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Painel de Recuperação - Tele Vendas</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <script src="https://echevarria-bi.github.io/crm-recuperacao/xlsx.full.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0c0c14;color:#eee;font-size:16px}
    header{background:#141428;border-bottom:2px solid #f59e0b;padding:16px 24px;display:flex;align-items:center;flex-wrap:wrap;gap:10px}
    header h1{font-size:26px;font-weight:700;color:#f59e0b;letter-spacing:.5px}
    .container{max-width:1400px;margin:0 auto;padding:24px 28px}
    .upload-area{display:block;border:2px dashed rgba(255,255,255,0.06);border-radius:16px;padding:64px;text-align:center;background:linear-gradient(135deg,#141428,#111a28);cursor:pointer;transition:.3s}
    .upload-area:hover{border-color:#f59e0b;background:linear-gradient(135deg,#141428,#1e2030)}
    .top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:14px}
    .top-bar .info{font-size:14px;color:#4a4d6e}
    .top-bar label{color:#9ca3af;font-size:14px;font-weight:500}
    .tabs-group{display:flex;align-items:center;gap:12px;background:#111122;border:1px solid #333;border-radius:12px;padding:9px 14px;margin-bottom:26px;flex-wrap:wrap}
    .tabs{display:flex;align-items:center;gap:4px}
    .tab-divider{width:1px;height:32px;background:linear-gradient(to bottom,transparent,#4a4d6e,transparent);margin:0 8px;flex-shrink:0}
    .tab-btn{padding:10px 22px;border:none;border-radius:8px;background:transparent;color:#6b7280;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:7px;white-space:nowrap;letter-spacing:.2px}
    .tab-btn:hover{color:#eee;background:rgba(255,255,255,.04)}
    .tab-btn.active{color:#fcd34d;background:linear-gradient(135deg,rgba(120,53,15,.35),rgba(69,25,3,.35));border:1px solid rgba(245,158,11,.3);box-shadow:0 0 14px rgba(245,158,11,.07)}
    .tab-month{color:#666;padding:14px 28px;font-size:14px;text-transform:uppercase;letter-spacing:.8px;font-weight:600}
    .tab-month:hover{color:#eee;background:rgba(255,255,255,.03)}
    .tab-month.active{color:#f59e0b;background:transparent;border:none;border-bottom:2.5px solid #f59e0b;border-radius:0;padding:14px 28px;box-shadow:none}
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px}
    .card{background:linear-gradient(135deg,#141428 0%,#111a28 100%);border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:22px 24px 18px;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}
    .card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.3);border-color:rgba(255,255,255,0.06)}
    .card .label{font-size:13px;color:#9ca3af;font-weight:600;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:5px}
    .card .value{font-size:32px;font-weight:800;margin-top:4px;color:#f0f2f8;line-height:1.2}
    .card .sub{font-size:14px;color:#e1e7ef;margin-top:6px}
    .var-up{color:#34d399}
    .var-down{color:#f87171}
    .meta-color{color:#fcd34d}
    .realizado-color{color:#34d399}
    .col-ranking{width:52px;text-align:center;color:#4a4d6e}
    .col-gap{width:90px;text-align:right}
    .badge-sm{padding:2px 10px;border-radius:3px;font-size:12px;font-weight:700;display:inline-block;white-space:nowrap}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-bottom:22px}
    .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
    .grid-5{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:28px}
    .grid-5 .card,.cards .card{display:flex;flex-direction:column;justify-content:center}
    .grid-5 .card .value,.cards .card .value{margin-top:0}
    @media(max-width:768px){.grid-2,.grid-4,.grid-5,.cards{grid-template-columns:1fr}.container{padding:18px}}
    .chart-box{background:linear-gradient(135deg,#141428 0%,#111a28 100%);border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:24px;margin-bottom:24px}
    .chart-box:hover{border-color:rgba(245,158,11,0.3)}
    .chart-box h2{font-size:19px;font-weight:700;margin-bottom:14px;color:#fcd34d;text-transform:uppercase;letter-spacing:.7px}
    .chart-box h2 .sub{font-size:15px;color:#bbb;font-weight:400;text-transform:none;letter-spacing:0}
    table{width:100%;border-collapse:collapse;font-size:17px}
    th{padding:12px 14px;text-align:left;font-weight:600;color:#f59e0b;font-size:14px;text-transform:uppercase;letter-spacing:.5px;background:#111;border-bottom:1px solid #333}
    td{padding:11px 14px;text-align:left;border-bottom:1px solid #1a1a2e;color:#ddd;font-variant-numeric:tabular-nums}
    tbody tr:hover{background:rgba(255,255,255,0.05)!important}
    tbody tr:nth-child(even){background:rgba(255,255,255,0.02)}
    .table-wrap{max-height:500px;overflow-y:auto;overflow-x:auto;border:1px solid #333;border-radius:10px}
    .table-wrap thead th{position:sticky;top:0;z-index:3;background:#0c0c14;box-shadow:0 1px 0 #333}
    .table-wrap tbody .tot-row td{position:sticky;bottom:0;z-index:2;background:#141428!important;box-shadow:0 -1px 0 #f59e0b}
    .table-wrap tfoot.tot-row td{position:sticky;bottom:0;z-index:2;background:#141428!important;box-shadow:0 -1px 0 #f59e0b}
    .text-right{text-align:right}
    .text-center{text-align:center}
    .tot-row td{background:#141428!important;border-top:2px solid #f59e0b;font-weight:700}
    .badge{padding:3px 12px;border-radius:4px;font-size:13px;font-weight:700;display:inline-block}
    .badge-green{background:rgba(52,211,153,.15);color:#34d399}
    .badge-red{background:rgba(239,68,68,.15);color:#f87171}
    .badge-yellow{background:rgba(245,158,11,.15);color:#fbbf24}
    .pct-bar{height:10px;background:#333;border-radius:4px;overflow:hidden;margin-top:6px}
    .pct-bar-fill{height:100%;border-radius:4px;min-width:2px}
    .spinner{display:inline-block;width:18px;height:18px;border:2px solid #333;border-top-color:#f59e0b;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
    @keyframes spin{to{transform:rotate(360deg)}}
    footer{text-align:center;padding:16px;font-size:13px;color:#555;border-top:1px solid #141428;margin-top:28px}
    footer strong{color:#666}
    @media print{body{background:#fff!important;color:#000!important}header,nav,.top-bar,.tabs,.upload-area,#inputArquivo,footer{display:none!important}.container{max-width:100%!important;padding:0!important}.chart-box{background:#fff!important;border:1px solid #ddd!important;break-inside:avoid}.chart-box h2{color:#333!important;border-left:none}.card{background:#f8f8f8!important;border:1px solid #ccc!important}.card .label{color:#666!important}.card .value{color:#000!important}th{color:#000!important;background:#f0f0f0!important}td{color:#333!important;border-color:#ddd!important}.tot-row td{background:#e8e8e8!important}@page{size:landscape;margin:8mm}}
  </style>
</head>
<body>
  <header>
    <a href="https://echevarria-bi.github.io/" style="color:#fcd34d;text-decoration:none;font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;margin-right:16px;white-space:nowrap;padding:8px 18px;border:1.5px solid rgba(245,158,11,0.3);border-radius:10px;background:linear-gradient(135deg,rgba(120,53,15,.25),rgba(69,25,3,.2));transition:all .3s;letter-spacing:.3px" onmouseover="this.style.borderColor='#f59e0b';this.style.boxShadow='0 0 20px rgba(245,158,11,0.15)'" onmouseout="this.style.borderColor='rgba(245,158,11,0.3)';this.style.boxShadow='none'">&#8592; Menu</a>
    <h1>&#128222; Painel de Recuperação — Tele Vendas</h1>
    <div style="margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span id="statusFile" style="font-size:13px;color:#6b7280"></span>
      <span id="tokenStatus" style="font-size:12px;color:#6b7280"></span>
      <input type="password" id="tokenInput" placeholder="Token GitHub" onkeydown="if(event.key==='Enter')setToken(this.value)" style="width:100px;background:#1a1a2e;border:1px solid #333;border-radius:6px;padding:5px 10px;color:#eee;font-size:13px;outline:none;display:none">
      <button onclick="setToken(document.getElementById('tokenInput').value)" id="btnSalvarToken" style="display:none"></button>
      <button onclick="var i=document.getElementById('tokenInput');i.style.display='';i.focus();this.style.display='none'" id="btnConfigToken" style="background:transparent;border:1px solid #4a4d6e;color:#9ca3af;padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer;display:none">&#128274; Token</button>
    </div>
  </header>
  <div class="container" id="app">
    <div style="position:relative;width:100%">
      <input type="file" id="inputArquivo" accept=".xlsx,.xls" multiple style="position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:5;font-size:0" onchange="try{if(this.files&&this.files.length){if(typeof processMultipleFiles==='function')processMultipleFiles(this.files);else document.getElementById('areaInicial').innerHTML='<div style=color:#f87171;font-size:13px>Erro: processMultipleFiles nao definido (_scriptExec='+(window._scriptExec||'false')+')</div>'}}catch(e){document.getElementById('areaInicial').innerHTML='<div style=color:#f87171;font-size:13px>Erro: '+e.message+'</div>';console.error(e)}">
      <div class="upload-area" id="areaInicial" ondragover="this.classList.add('dragover');event.preventDefault()" ondragleave="this.classList.remove('dragover')" ondrop="event.preventDefault();this.classList.remove('dragover');if(event.dataTransfer.files[0])processFile(event.dataTransfer.files[0])">
        <div style="font-size:48px;margin-bottom:12px;opacity:.5">📂</div>
        <div style="font-size:16px;color:#9ca3af;font-weight:500">Clique para selecionar o arquivo Excel</div>
        <div style="font-size:13px;color:#4a4d6e;margin-top:4px">Painel CRM - Junho.xlsx (com aba EVOLUCAO DOS MESES)</div>
      </div>
    </div>
  </div>
  <div id="tabsContainer"></div>
  <div id="dashContent"></div>
  <footer id="footer" style="display:none"></footer>

  <script>
    window._scriptExec = true;
    try { if (typeof Chart !== 'undefined' && typeof ChartDataLabels !== 'undefined') Chart.register(ChartDataLabels); } catch(e) {}
    var app = document.getElementById('app');
    var inputArquivo = document.getElementById('inputArquivo');
    var allData = null;
    var activeTab = 'resumo';
    var GH_TOKEN = function(){ try { return localStorage.getItem('crmToken') || ''; } catch(e) { return ''; } };
    var GH_OWNER = 'echevarria-bi';
    var GH_REPO = 'crm-recuperacao';
    var GH_FILE = 'data.json';
    var GH_BRANCH = 'main';

    // change handled via inline onchange on the input

    function abrirArquivo() { inputArquivo.click(); }

    function fetchRemoteData() {
      return fetch('https://raw.githubusercontent.com/' + GH_OWNER + '/' + GH_REPO + '/' + GH_BRANCH + '/' + GH_FILE + '?t=' + Date.now())
        .then(function(r) { if (!r.ok) throw new Error('not found'); return r.json(); })
        .catch(function() { return null; });
    }

    function getToken() { return GH_TOKEN(); }
    function setToken(t) {
      if (t) {
        localStorage.setItem('crmToken', t);
        document.getElementById('tokenStatus').textContent = 'Token salvo';
        document.getElementById('tokenStatus').style.color = '#34d399';
        document.getElementById('btnConfigToken').style.display = 'none';
        document.getElementById('tokenInput').style.display = 'none';
        document.getElementById('btnSalvarToken').style.display = 'none';
      }
    }
    function mostrarTokenBtn() {
      if (!GH_TOKEN()) {
        document.getElementById('btnConfigToken').style.display = 'inline-flex';
        document.getElementById('tokenStatus').textContent = '';
      } else {
        document.getElementById('tokenStatus').textContent = 'Token configurado';
        document.getElementById('tokenStatus').style.color = '#34d399';
      }
    }

    function saveRemoteData(data, fileName) {
      var token = getToken();
      if (!token) {
        document.getElementById('tokenStatus').textContent = 'Token não configurado';
        document.getElementById('tokenStatus').style.color = '#f87171';
        return Promise.resolve(false);
      }
      if (!data || !data.data || !data.data.evolucaoMeses || !data.data.painelGeral) return Promise.resolve(false);
      var content = JSON.stringify(data, null, 2);
      var base64 = btoa(unescape(encodeURIComponent(content)));
      var commitMsg = 'Atualização ' + (fileName || '') + ' - ' + new Date().toLocaleString('pt-BR');
      var url = 'https://api.github.com/repos/' + GH_OWNER + '/' + GH_REPO + '/contents/' + GH_FILE;
      return fetch(url + '?ref=' + GH_BRANCH, { headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github.v3+json' } })
        .then(function(r) { return r.ok ? r.json() : null; })
        .then(function(existing) {
          var body = { message: commitMsg, content: base64, branch: GH_BRANCH };
          if (existing && existing.sha) body.sha = existing.sha;
          return fetch(url, { method: 'PUT', headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github.v3+json' }, body: JSON.stringify(body) });
        })
        .then(function(r) { return r.ok; })
        .catch(function() { return false; });
    }

    function detectMonthFromName(fileName) {
      var n = fileName.toLowerCase();
      if (n.indexOf('abril') >= 0) return 'Abril';
      if (n.indexOf('maio') >= 0) return 'Maio';
      if (n.indexOf('julho') >= 0) return 'Julho';
      return 'Junho';
    }

    function processMultipleFiles(files) {
      var total = files.length;
      allData = null;
      var junhoWb = null, processados = 0;
      function maybeDone() {
        if (processados < total) return;
        inputArquivo.value = '';
        // Always parse EVOLUCAO DOS MESES, FATURAMENTO and PROFISSIONAIS from Junho
        if (junhoWb) {
          var sm = {};
          for (var si = 0; si < junhoWb.SheetNames.length; si++) {
            var sn = junhoWb.SheetNames[si];
            sm[sn.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')] = junhoWb.Sheets[sn];
          }
          var evolKey = 'evolucao dos meses'.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
          if (sm[evolKey]) {
            allData.evolucaoMeses = {indicadores:[], valorPorProf:[], recuperadosPorProf:[]};
            var grid = XLSX.utils.sheet_to_json(sm[evolKey], {header:1, defval:''});
            parseEvolucaoMeses(grid, allData);
          }
          // FATURAMENTO RECUPERACAO from Junho
          var fatKey = 'faturamento recuperacao'.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
          if (sm[fatKey]) {
            var fg = XLSX.utils.sheet_to_json(sm[fatKey], {header:1, defval:''});
            allData.faturamentoClientes = [];
            for (var fr = 1; fr < fg.length; fr++) {
              var row = fg[fr];
              if (!row || !row[0]) continue;
              var fp = String(row[0]).trim();
              var fid = parseInt(row[1]);
              var fnome = String(row[2]||'').trim();
              var fv = parseNum(row[3]);
              var fm = String(row[4] || '').trim();
              if (!fp || !fm || ['Abril','Maio','Junho','Julho'].indexOf(fm) < 0) continue;
              if (isNaN(fid) || fid <= 0) continue;
              allData.faturamentoClientes.push({cliente:fid, nome:fnome, valor:fv, mes:fm, prof:fp});
            }
            allData.faturamentoClientes.sort(function(a,b){return b.valor - a.valor;});
          }
        }
        var fn = Array.prototype.map.call(files,function(f){return f.name;}).join(', ');
        document.getElementById('areaInicial').innerHTML = '<div style="font-size:40px;margin-bottom:8px">✅</div><div style="color:#34d399;font-size:15px;font-weight:600">' + total + ' arquivo(s) carregado(s)</div><div style="color:#6b7280;font-size:12px;margin-top:2px">Mesclado com sucesso</div>';
        var now = new Date();
        document.getElementById('footer').style.display = 'block';
        document.getElementById('footer').innerHTML = '<strong>' + fn + '</strong> &middot; ' + now.toLocaleDateString('pt-BR') + ' &agrave;s ' + now.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'}) + ' &middot; Painel de Recupera\u00E7\u00E3o';
        initTabs();
        switchTab('resumo');
        salvarStorage();
        mostrarTokenBtn();
        saveRemoteData({ data: allData, fileName: fn, updatedAt: new Date().toISOString() }, fn).then(function(ok) {
          document.getElementById('statusFile').textContent = ok ? 'Salvo no repositório' : 'Erro ao salvar no repositório';
          document.getElementById('statusFile').style.color = ok ? '#34d399' : '#f87171';
          setTimeout(function() { document.getElementById('statusFile').textContent = ''; }, 5000);
        });
      }
      function processOne(file) {
        document.getElementById('areaInicial').innerHTML = '<div style="color:#f59e0b;margin-bottom:6px"><span class="spinner"></span></div><div style="color:#fcd34d;font-size:14px">Processando ' + file.name + ' (' + (processados+1) + '/' + total + ')...</div>';
        var reader = new FileReader();
        reader.onload = function(ev) {
          try {
            var data = new Uint8Array(ev.target.result);
            var wb = XLSX.read(data, {type:'array'});
            var month = detectMonthFromName(file.name);
            if (!allData) {
              allData = parseAllSheets(wb, month);
              // DEBUG: log July realizados
              if (allData && allData.painelJulho && allData.painelJulho.recuperacao) {
                var _jTotal = allData.painelJulho.recuperacao.total;
                var _jProfs = allData.painelJulho.recuperacao.profissionais;
                console.log('DEBUG Julho:');
                console.log('  Total:', JSON.stringify(_jTotal));
                console.log('  Profissionais:', JSON.stringify(_jProfs));
                if (_jTotal) console.log('  Realizado Total:', _jTotal.realizado);
              }
            } else {
              mergeSheetInto(wb, month);
            }
            if (month === 'Junho') junhoWb = wb;
            processados++;
            maybeDone();
          } catch(err) {
            document.getElementById('areaInicial').innerHTML = '<div style="font-size:40px;margin-bottom:8px">&#9888;</div><div style="color:#f87171;font-size:14px">Erro em ' + file.name + ': ' + err.message + '</div><div style="color:#4a4d6e;font-size:12px;margin-top:4px;cursor:pointer" onclick="abrirArquivo()">Clique para tentar novamente</div>';
          }
        };
        reader.readAsArrayBuffer(file);
      }
      for (var fi = 0; fi < total; fi++) processOne(files[fi]);
    }

    function mergeSheetInto(wb, monthName) {
      var pgMap = {abril:'painelAbril',maio:'painelMaio',junho:'painelGeral',julho:'painelJulho'};
      var targetKey = pgMap[monthName.toLowerCase()] || 'painelGeral';
      for (var si = 0; si < wb.SheetNames.length; si++) {
        var sNorm = wb.SheetNames[si].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[-\s]/g,'');
        var tgt = {'painelgeralabril':'painelAbril','painelgeralmaio':'painelMaio','painelgeraljunho':'painelGeral','painelgeral':'painelGeral'}[sNorm];
        if (tgt === targetKey) {
          var pg = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[si]], {header:1, defval:''});
          allData[targetKey] = {recuperacao:{profissionais:[],total:null,faturamentoGeral:0}, metaContatos:{profissionais:[],total:null}, motivos:[], inatividade:[], motivosDiarios:[]};
          parsePainelGeral(pg, {painelGeral: allData[targetKey]});
          return;
        }
      }
    }

    function processFile(file) {
      document.getElementById('areaInicial').innerHTML = '<div style="color:#f59e0b;margin-bottom:6px"><span class="spinner"></span></div><div style="color:#fcd34d;font-size:14px">Processando ' + file.name + '...</div>';
      var reader = new FileReader();
      reader.onload = function(ev) {
        inputArquivo.value = '';
        try {
          var data = new Uint8Array(ev.target.result);
          var wb = XLSX.read(data, {type:'array'});
          allData = parseAllSheets(wb);
          document.getElementById('areaInicial').innerHTML = '<div style="font-size:40px;margin-bottom:8px">✅</div><div style="color:#34d399;font-size:15px;font-weight:600">' + file.name + '</div><div style="color:#6b7280;font-size:12px;margin-top:2px">Carregado com sucesso</div>';
          var now = new Date();
          document.getElementById('footer').style.display = 'block';
          document.getElementById('footer').innerHTML = '<strong>' + file.name + '</strong> &middot; ' + now.toLocaleDateString('pt-BR') + ' &agrave;s ' + now.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'}) + ' &middot; Painel de Recupera\u00E7\u00E3o';
          initTabs();
          switchTab('resumo');
          salvarStorage();
          mostrarTokenBtn();
          saveRemoteData({ data: allData, fileName: file.name, updatedAt: new Date().toISOString() }, file.name).then(function(ok) {
            document.getElementById('statusFile').textContent = ok ? 'Salvo no repositório' : 'Erro ao salvar no repositório';
            document.getElementById('statusFile').style.color = ok ? '#34d399' : '#f87171';
            setTimeout(function() { document.getElementById('statusFile').textContent = ''; }, 5000);
          });
        } catch(err) {
          document.getElementById('areaInicial').innerHTML = '<div style="font-size:40px;margin-bottom:8px">⚠</div><div style="color:#f87171;font-size:14px">Erro: ' + err.message + '</div><div style="color:#4a4d6e;font-size:12px;margin-top:4px;cursor:pointer" onclick="abrirArquivo()">Clique para tentar novamente</div>';
        }
      };
      reader.readAsArrayBuffer(file);
    }



    function parseAllSheets(wb, baseMonth) {
      baseMonth = baseMonth || 'Junho';
      var result = {evolucaoMeses:{indicadores:[], valorPorProf:[], recuperadosPorProf:[]}, painelGeral:{recuperacao:{profissionais:[],total:null,faturamentoGeral:0}, metaContatos:{profissionais:[],total:null}, motivos:[], inatividade:[], motivosDiarios:[], rcaExterno:null}, painelAbril:{recuperacao:{profissionais:[],total:null,faturamentoGeral:0}, metaContatos:{profissionais:[],total:null}, motivos:[], inatividade:[], motivosDiarios:[], rcaExterno:null}, painelMaio:{recuperacao:{profissionais:[],total:null,faturamentoGeral:0}, metaContatos:{profissionais:[],total:null}, motivos:[], inatividade:[], motivosDiarios:[], rcaExterno:null}, painelJulho:{recuperacao:{profissionais:[],total:null,faturamentoGeral:0}, metaContatos:{profissionais:[],total:null}, motivos:[], inatividade:[], motivosDiarios:[], rcaExterno:null}, profissionais:{}, faturamentoTotal:0, faturamentoClientes:[]};
      var sheetMap = {};
      for (var si = 0; si < wb.SheetNames.length; si++) {
        var sn = wb.SheetNames[si];
        sheetMap[sn.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')] = wb.Sheets[sn];
      }

      // EVOLUCAO DOS MESES
      var evolKey = 'evolucao dos meses'.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
      if (sheetMap[evolKey]) {
        var grid = XLSX.utils.sheet_to_json(sheetMap[evolKey], {header:1, defval:''});
        parseEvolucaoMeses(grid, result);
      }

      // PAINEL GERAL sheets (Painel Geral - Abril, Painel Geral - Maio, Painel Geral - Junho)
      var pgTargets = {'painelgeralabril':'painelAbril','painelgeralmaio':'painelMaio','painelgeraljunho':'painelGeral','painelgeraljulho':'painelJulho','painelgeral':'painelGeral'};
      for (var si = 0; si < wb.SheetNames.length; si++) {
        var sNorm = wb.SheetNames[si].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[-\s]/g,'');
        var targetStore = pgTargets[sNorm];
        if (targetStore) {
          var pg = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[si]], {header:1, defval:''});
          result[targetStore] = {recuperacao:{profissionais:[],total:null,faturamentoGeral:0}, metaContatos:{profissionais:[],total:null}, motivos:[]};
          parsePainelGeral(pg, {painelGeral: result[targetStore]});
        }
      }

      // PROFISSIONAIS (parsing desativado — usa apenas Painel Geral)

      // FATURAMENTO RECUPERACAO
      var fatKey = 'faturamento recuperacao'.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
      if (sheetMap[fatKey]) {
        var fg = XLSX.utils.sheet_to_json(sheetMap[fatKey], {header:1, defval:''});
        result.faturamentoClientes = [];
        for (var fr = 1; fr < fg.length; fr++) {
          var row = fg[fr];
          if (!row || !row[0]) continue;
          var fp = String(row[0]).trim();
          var fid = parseInt(row[1]);
          var fnome = String(row[2]||'').trim();
          var fv = parseNum(row[3]);
          var fm = String(row[4] || '').trim();
          if (!fp || !fm || ['Abril','Maio','Junho','Julho'].indexOf(fm) < 0) continue;
          if (isNaN(fid) || fid <= 0) continue;
          result.faturamentoClientes.push({cliente:fid, nome:fnome, valor:fv, mes:fm, prof:fp});
        }
        result.faturamentoClientes.sort(function(a,b){return b.valor - a.valor;});
      }

      return result;
    }

    function parseEvolucaoMeses(grid, result) {
      for (var r = 0; r < grid.length; r++) {
        var row = grid[r];
        if (!row || !row[0]) continue;
        var label = String(row[0]).trim();
        if (label === 'Indicador') {
          for (var ri = r+1; ri < grid.length; ri++) {
            var r2 = grid[ri];
            if (!r2 || !r2[0] || String(r2[0]).trim() === '') break;
            if (r2[4] === undefined || r2[4] === '') break;
            var indLabel = String(r2[0]).trim();
            var isPct = indLabel.indexOf('%') >= 0;
            result.evolucaoMeses.indicadores.push({
              label: indLabel,
              Abril: isPct ? parsePct(r2[1]) : parseNum(r2[1]),
              Maio: isPct ? parsePct(r2[2]) : parseNum(r2[2]),
              Junho: isPct ? parsePct(r2[3]) : parseNum(r2[3]),
              Julho: isPct ? parsePct(r2[4]) : parseNum(r2[4])
            });
          }
          continue;
        }
        if (label === 'Mês' && String(row[1]||'').trim() === 'Conversões') {
          for (var ri = r+1; ri < grid.length; ri++) {
            var r2 = grid[ri];
            if (!r2 || !r2[0] || String(r2[0]).trim() === '') break;
          }
          continue;
        }
        if (label === 'Mês' && String(row[1]||'').trim() === 'Meta' && String(row[2]||'').trim() === 'Realizado') {
          for (var ri = r+1; ri < grid.length; ri++) {
            var r2 = grid[ri];
            if (!r2 || !r2[0]) break;
          }
          continue;
        }
        if (label === 'Profissional' && String(row[1]||'').trim() === 'Abril') {
          var colNames = [];
          for (var ci = 1; ci < row.length; ci++) { colNames.push(String(row[ci]).trim()); }
          for (var ri = r+1; ri < grid.length; ri++) {
            var r2 = grid[ri];
            if (!r2 || !r2[0] || String(r2[0]).trim() === '') break;
            var profName = String(r2[0]).trim();
            var dup = false;
            for (var di = 0; di < result.evolucaoMeses.valorPorProf.length; di++) {
              if (result.evolucaoMeses.valorPorProf[di].profissional === profName) { dup = true; break; }
            }
            if (dup || profName.toLowerCase() === 'equipe') continue;
            var entry = {profissional: profName};
            for (var ci = 0; ci < colNames.length; ci++) {
              var cv = parseNum(r2[ci+1]);
              if (cv > 0) entry[colNames[ci]] = cv;
            }
            if (colNames.indexOf('Total') >= 0) entry.Total = parseNum(r2[colNames.indexOf('Total')+1]);
            result.evolucaoMeses.valorPorProf.push(entry);
          }
          continue;
        }
        if (label === 'RECUPERADOS POR RCA' || label === 'RECUPERADOS POR RAC') {
          // Extract month labels from title row
          var rcaMonths = [];
          var titleRow = grid[r] || [];
          for (var ci = 1; ci < titleRow.length; ci++) {
            var tv = String(titleRow[ci]).trim();
            if (tv.indexOf('Painel ') >= 0) {
              var m = tv.replace(/.*?Painel\s*(?:CRM\s*)?-?\s*/i,'').trim();
              if (m) rcaMonths.push(m);
            }
          }
          // Find actual header row (skip empty rows)
          var hdrRow = r + 1;
          while (hdrRow < grid.length) {
            var hr = grid[hdrRow];
            if (hr && String(hr[0]).trim() !== '' && hr[1] !== undefined && hr[1] !== null && String(hr[1]).trim() !== '') break;
            hdrRow++;
          }
          if (hdrRow < grid.length) {
            var hdr = grid[hdrRow];
            // First column is month label, extract it
            var firstMonth = String(hdr[0]).trim().replace(/.*?Painel\s*(?:CRM\s*)?-?\s*/i,'').trim() || 'Mês';
            var allMonths = [firstMonth].concat(rcaMonths);
            var rcaCols = [];
            var midx = 0;
            for (var ci = 1; ci < (hdr||[]).length; ci++) {
              var cn = String(hdr[ci]).trim();
              if (!cn) continue;
              var cu = cn.toUpperCase();
              if (cu === 'META') {
                rcaCols.push((allMonths[midx]||'Mês') + ' ' + cn);
                midx++;
              } else if (cu === 'REAL' || cu === 'REALIZADO') {
                rcaCols.push((allMonths[midx-1]||'Mês') + ' ' + cn);
              } else if (cn.indexOf('%') >= 0) {
                rcaCols.push((allMonths[midx-1]||'Mês') + ' ' + cn);
              } else {
                rcaCols.push(cn);
              }
            }
            for (var ri = hdrRow + 1; ri < grid.length; ri++) {
              var r2 = grid[ri];
              if (!r2 || !r2[0] || String(r2[0]).trim() === '') break;
              var profName = String(r2[0]).trim();
              if (profName.toLowerCase() === 'equipe' || profName.toLowerCase() === 'total') continue;
              var entry = {profissional: profName};
              for (var ci = 0; ci < rcaCols.length; ci++) {
                var cv = rcaCols[ci].indexOf('%') >= 0 ? parsePct(r2[ci+1]) : parseNum(r2[ci+1]);
                if (cv > 0) entry[rcaCols[ci]] = cv;
              }
              result.evolucaoMeses.recuperadosPorProf.push(entry);
            }
          }
          continue;
        }
      }
    }

    function parsePainelGeral(grid, result) {
      var recRow = -1, motRow = -1, contRow = -1, fatRow = -1, inatRow = -1;
      for (var r = 0; r < grid.length; r++) {
        var row = grid[r];
        if (!row || !row[0]) continue;
        var c = String(row[0]).trim();
        var cu = c.toUpperCase();
        if (cu === 'META RECUPERAÇÃO' || cu === 'META RECUPERACAO' || cu === 'META POSITIVAÇÃO' || cu === 'META POSITIVACAO') recRow = r;
        if (cu === 'MOTIVOS') motRow = r;
        if (cu.indexOf('FAIXA DE INATIVIDADE') >= 0) inatRow = r;
        if (cu.indexOf('META CONTATOS') >= 0) contRow = r;
        if (cu === 'TELEVENDEDORA') fatRow = r;
      }

      if (recRow >= 0) {
        var dayNums = [];
        var metaRow = grid[recRow];
        if (metaRow) { for (var dc = 4; dc < metaRow.length; dc += 2) dayNums.push(metaRow[dc] !== '' && metaRow[dc] !== undefined ? parseInt(metaRow[dc]) : dayNums.length + 1); }
        result.painelGeral.recuperacao.dayNums = dayNums;
        var r = recRow + 2;
        while (r < grid.length) {
          var row = grid[r];
          if (!row || !row[0]) { r++; continue; }
          var name = String(row[0]).trim();
          if (!name || name === 'Total' || name === '') {
            if (name === 'Total') result.painelGeral.recuperacao.total = {profissional:'Total', meta:parseNum(row[1]), realizado:parseNum(row[2]), pct:parsePct(row[3]), dias:parseDias(row,4,dayNums)};
            break;
          }
          result.painelGeral.recuperacao.profissionais.push({profissional:name, meta:parseNum(row[1]), realizado:parseNum(row[2]), pct:parsePct(row[3]), dias:parseDias(row,4,dayNums), faturamento:0});
          r++;
        }
      }

      if (fatRow >= 0) {
        var fr = fatRow + 1;
        while (fr < grid.length) {
          var row = grid[fr];
          if (!row || !row[0]) { fr++; continue; }
          var name = String(row[0]).trim();
          if (!name) { fr++; continue; }
          var isTotal = name.toUpperCase().indexOf('TOTAL') === 0;
          if (isTotal) {
            result.painelGeral.recuperacao.faturamentoGeral = parseNum(row[1]);
            break;
          }
          for (var pi = 0; pi < result.painelGeral.recuperacao.profissionais.length; pi++) {
            var p = result.painelGeral.recuperacao.profissionais[pi];
            var pNorm = p.profissional.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
            var fNorm = name.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
            if (pNorm === fNorm) {
              p.faturamento = parseNum(row[1]);
              break;
            }
          }
          fr++;
        }
      }

      function parseMatrix(start, endBoundary) {
        var colNames = [], hdr = grid[start];
        if (hdr) for (var c = 1; c < hdr.length; c++) if (hdr[c] !== '' && hdr[c] !== undefined) colNames.push(hdr[c]);
        var entries = [], mr = start + 1;
        while (mr < grid.length) {
          var row = grid[mr];
          if (!row || !row[0]) break;
          var label = String(row[0]).trim();
          if (!label) break;
          if (endBoundary && label.toUpperCase().indexOf(endBoundary) >= 0) break;
          if (label === 'Total') {
            var tv = {label:'Total'};
            for (var j = 0; j < colNames.length && j+1 < row.length; j++) tv[colNames[j]] = parseNum(row[j+1]);
            entries.push(tv);
            break;
          }
          var entry = {label:label};
          for (var j = 0; j < colNames.length && j+1 < row.length; j++) entry[colNames[j]] = parseNum(row[j+1]);
          entries.push(entry);
          mr++;
        }
        return entries;
      }
      if (inatRow >= 0) {
        result.painelGeral.inatividade = parseMatrix(inatRow, 'MOTIVOS');
      }
      if (motRow >= 0) {
        result.painelGeral.motivos = parseMatrix(motRow, 'META CONTATOS');
        result.painelGeral.motivosDiarios = result.painelGeral.motivos; // same data, kept for clarity
      }

      if (contRow >= 0) {
        var r = contRow + 2;
        while (r < grid.length) {
          var row = grid[r];
          if (!row || !row[0]) { r++; continue; }
          var name = String(row[0]).trim();
          if (!name || name === 'Total') {
            if (name === 'Total') result.painelGeral.metaContatos.total = {profissional:'Total', meta:parseNum(row[1]), realizado:parseNum(row[2]), pct:parsePct(row[3]), dias:parseDias(row,4)};
            break;
          }
          result.painelGeral.metaContatos.profissionais.push({profissional:name, meta:parseNum(row[1]), realizado:parseNum(row[2]), pct:parsePct(row[3]), dias:parseDias(row,4)});
          r++;
        }
      }

      // RCA Externo — try summary rows first (Faturamento RCA Externo + Numero de clientes)
      var rcaFat = -1, rcaCli = -1;
      for (var rcaR = 0; rcaR < grid.length; rcaR++) {
        var r = grid[rcaR];
        if (!r || !r[0]) continue;
        var lbl = String(r[0]).trim().toUpperCase();
        if (lbl.indexOf('FATURAMENTO RCA') >= 0) rcaFat = rcaR;
        if (lbl.indexOf('NUMERO DE CLIENTES') >= 0 || lbl.indexOf('NÚMERO DE CLIENTES') >= 0) rcaCli = rcaR;
      }
      if (rcaFat >= 0 && rcaCli >= 0) {
        result.painelGeral.rcaExterno = {
          clientes: [],
          totalClientes: parseNum(grid[rcaCli][1]),
          totalFaturamento: parseNum(grid[rcaFat][1])
        };
      } else {
        // Fallback: matrix with header ["Empresa","Responsavel",...]
        for (var rcaR = 0; rcaR < grid.length - 1; rcaR++) {
          var r = grid[rcaR];
          if (r && r[0] === 'Empresa' && r[1] === 'Responsavel') {
            var rcaClientes = [], rcaR2 = rcaR + 1;
            while (rcaR2 < grid.length) {
              var r2 = grid[rcaR2];
              if (!r2 || !r2[0]) break;
              var nomeEmpresa = String(r2[0]).trim();
              if (!nomeEmpresa) break;
              rcaClientes.push({
                empresa: nomeEmpresa,
                responsavel: r2[1] || '',
                regiao: r2[2] || '',
                codcli: r2[3] || '',
                faturamento: parseNum(r2[4])
              });
              rcaR2++;
            }
            var totalFat = rcaClientes.reduce(function(s, c){ return s + c.faturamento; }, 0);
            result.painelGeral.rcaExterno = { clientes: rcaClientes, totalClientes: rcaClientes.length, totalFaturamento: totalFat };
            break;
          }
        }
      }
    }

    function parseProfessionalSheet(name, grid) {
      var data = {conversao:{}, contatos:{meta:0,realizado:0}, clientes:[], faturamento:0};
      var convRow = -1, contRow = -1;
      for (var r = 0; r < Math.min(grid.length, 50); r++) {
        var row = grid[r];
        if (!row || !row[0]) continue;
        var c = String(row[0]).trim().toUpperCase();
        if (c.indexOf('META CONVERSÃO') >= 0 || c.indexOf('META CONVERSAO') >= 0) convRow = r;
        if (c.indexOf('META CONTATO') >= 0) contRow = r;
      }
      if (convRow >= 0) {
        var metaRow = grid[convRow + 2];
        var convRowData = grid[convRow + 3];
        if (metaRow && convRowData) {
          var dias = [];
          for (var c = 4; c < metaRow.length; c++) {
            var dayNum = parseInt(metaRow[c]);
            if (!isNaN(dayNum) && dayNum >= 1 && dayNum <= 31) dias.push({dia:dayNum, meta:parseNum(metaRow[c]), realizado:parseNum(convRowData[c])});
          }
          data.conversao.dias = dias;
        }
      }
      if (contRow >= 0) {
        var metaRow = grid[contRow + 1];
        var realizRow = grid[contRow + 2];
        if (metaRow && realizRow) { data.contatos.meta = parseNum(metaRow[1]); data.contatos.realizado = parseNum(realizRow[1]); }
      }
      for (var r = 2; r < grid.length; r++) {
        var row = grid[r];
        if (row && row[29] !== undefined && row[29] !== '') data.faturamento += parseNum(row[29]);
      }
      return data;
    }

    function parseNum(v) { if (v===''||v===undefined||v===null) return 0; if (typeof v==='number') return v; var s=String(v).trim().replace(/[^\d.,-]/g,'').replace(',','.').replace(/\.(?=.*\.)/g,''); var n=parseFloat(s); return isNaN(n)?0:n; }
    function parsePct(v) { if (v===''||v===undefined||v===null) return 0; if (typeof v==='number') return Math.round(v*10000)/100; var s=String(v).trim().replace('%','').replace(',','.'); var n=parseFloat(s); return isNaN(n)?0:n; }
    function parseCurrency(v) { if (v===''||v===undefined||v===null) return 0; if (typeof v==='number') return v; return parseFloat(String(v).replace(/R\$\s*/gi,'').replace(/\./g,'').replace(',','.').trim())||0; }
    function parseDias(row, startCol, dayNums) { var dias=[]; for (var c=startCol; c+1<row.length; c+=2) { var di = (c-startCol)/2; dias.push({dia: dayNums&&dayNums[di]?dayNums[di]:di+1, meta:parseNum(row[c]), realizado:parseNum(row[c+1])}); } return dias; }
    function fmtCurr(v) { if (v==null||isNaN(v)) return '-'; return 'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
    function fmtDate(s) { if (!s || s.length < 10) return s; var p = s.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
    var icn = function(n,s){s=s||14; return '<i data-lucide="'+n+'" style="display:inline-block;width:'+s+'px;height:'+s+'px;vertical-align:middle;stroke:currentColor;stroke-width:2;flex-shrink:0;margin-right:4px"></i>';};

      // RCA Externo totals from matriz (skip header "Mês" and "Total" row)

      html += '<div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:24px;padding:22px 28px;background:linear-gradient(135deg,#1a1a2e,#16213e);border:1px solid rgba(245,158,11,0.3);border-radius:16px;box-shadow:0 2px 20px rgba(245,158,11,0.08)">';

      html += '<div style="width:1px;height:34px;background:linear-gradient(to bottom,transparent,#4a4d6e,transparent)"></div>';
      html += '<span style="font-size:32px;font-weight:800;color:#f0f2f8">' + totalGeralClientes + ' <span style="font-size:14px;color:#6b7280;font-weight:500">clientes</span></span>';
      html += '<span style="font-size:28px;color:#4a4d6e;font-weight:200">|</span>';
      html += '<span style="font-size:32px;font-weight:800;color:#fbbf24">' + fmtCurr(totalGeralFaturamento) + '</span>';
      html += '<span style="flex:1;min-width:12px"></span>';
      html += '<div style="display:flex;gap:16px;padding:10px 20px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:10px;flex-wrap:wrap">';
      html += '<span style="font-size:14px;color:#34d399;font-weight:600">\u25cf Internos (Televendas): ' + recupTotal + ' clientes \u00B7 ' + fmtCurr(fatGeraluramento) + '</span>';

      html += '<div class="card"><div class="label">' + icn('users',12) + ' Televendas</div><div class="value" style="font-size:34px">' + recupTotal + ' <span style="font-size:14px;color:#6b7280;font-weight:400">clientes</span></div><div class="sub" style="font-size:22px;font-weight:700;color:#34d399;margin-top:2px">' + fmtCurr(fatGeraluramento) + '</div><div style="font-size:13px;color:#9ca3af;margin-top:4px">' + (totalGeralClientes > 0 ? Math.round(recupTotal / totalGeralClientes * 100) : 0) + '% do total</div></div>';
      html += '<div class="card" style="border-color:rgba(245,158,11,0.3)"><div class="label" style="color:#f59e0b">' + icn('users',12) + ' RCA Externo</div><div class="value" style="font-size:34px;color:#f0f2f8">' + rcaTotalClientes + ' <span style="font-size:14px;color:#6b7280;font-weight:400">clientes</span></div><div class="sub" style="font-size:22px;font-weight:700;color:#34d399;margin-top:2px">' + fmtCurr(rcaTotalFaturamento) + '</div><div style="font-size:11px;color:#6b7280;margin-top:4px">' + (totalGeralClientes > 0 ? Math.round(rcaTotalClientes / totalGeralClientes * 100) : 0) + '% do total</div></div>';
      html += '</div>';

      // VALOR POR PROFISSIONAL com agrupamento por região (accordion com rotação REAL)

        function profData(nome){

        if(!window.toggleValRec){

        }
        var meses=['Abril','Maio','Junho','Julho'];

          // Calculate per-month region sum based on who was in that region each month

          meses.forEach(function(m,mi){

          vpGrandTot+=regTotal;

          vpRows+='<tr class="vr-head" onclick="toggleValRec(this)" style="cursor:pointer">'+

          vpRows+='<td class="text-right" style="color:#fbbf24;font-weight:700">'+fmtCurr(regTotal)+'</td></tr>';

          profs.forEach(function(nome){

              '<td style="padding-left:32px;color:#c4c9d4">'+nome+'</td>';
            meses.forEach(function(m){
              // Only show value for months when this professional was in this region

              if (naRegiao && p && p[m]) {
                var v=p[m];
                pTotal+=v;
                vpRows+='<td class="text-right realizado-color" style="font-weight:400;font-size:14px;color:#9ca3af">'+fmtCurr(v)+'</td>';
              } else if (naRegiao) {
                vpRows+='<td class="text-right" style="color:#555;font-size:14px">0</td>';
              } else {
                vpRows+='<td class="text-right" style="color:#4a4d6e;font-size:14px">—</td>';
              }
            });

          });
        });
        var vpHtml = '<div class="chart-box"><h2>Valor Recuperado por Mês (Televendas) <span class="sub">&rarr; Faturamento por região com rotação de vendedores — clique na região para detalhe</span></h2><div class="table-wrap"><table><thead><tr><th class="col-ranking"></th><th>Região / Televendedora</th><th class="text-right">Abril</th><th class="text-right">Maio</th><th class="text-right">Junho</th><th class="text-right">Julho</th><th class="text-right">Total</th></tr></thead><tbody>' + vpRows + '<tr class="tot-row"><td class="col-ranking"></td><td style="color:#fcd34d;font-weight:700">Total</td><td class="text-right realizado-color" style="font-weight:700">' + fmtCurr(vpColTotais[0]) + '</td><td class="text-right realizado-color" style="font-weight:700">' + fmtCurr(vpColTotais[1]) + '</td><td class="text-right realizado-color" style="font-weight:700">' + fmtCurr(vpColTotais[2]) + '</td><td class="text-right realizado-color" style="font-weight:700">' + fmtCurr(vpColTotais[3]) + '</td><td class="text-right" style="color:#fbbf24;font-weight:700">' + fmtCurr(vpGrandTot) + '</td></tr></tbody></table></div></div>';
      }

      // RECUPERADOS POR PROFISSIONAL (from RECUPERADOS POR RCA)
      if (evo.recuperadosPorProf.length > 0) {
        var rpCols = [];
        var colSeen = {};
        for (var ei = 0; ei < evo.recuperadosPorProf.length; ei++) {
          for (var rk in evo.recuperadosPorProf[ei]) {
            if (rk !== 'profissional' && !colSeen[rk] && rk.indexOf('%') < 0) { colSeen[rk] = true; rpCols.push(rk); }
          }
        }
        // Group columns as (META, REAL) pairs
        var rpPairs = [];
        for (var rci = 0; rci + 1 < rpCols.length; rci += 2) {
          rpPairs.push({meta: rpCols[rci], real: rpCols[rci+1]});
        }
        var rpSorted = evo.recuperadosPorProf.slice().sort(function(a,b){
          var av = rpCols.length > 0 ? (a[rpCols[0]]||0) : 0;
          var bv = rpCols.length > 0 ? (b[rpCols[0]]||0) : 0;
          return bv - av;
        });
        var rpRows = '';
        for (var i = 0; i < rpSorted.length; i++) {
          var p = rpSorted[i];
          var medal = i === 0 ? '&#x1F947; ' : i === 1 ? '&#x1F948; ' : i === 2 ? '&#x1F949; ' : '';
          rpRows += '<tr><td class="col-ranking">' + medal + (i+1) + '</td><td style="font-weight:600;font-size:13px">' + p.profissional + '</td>';
          for (var pi = 0; pi < rpPairs.length; pi++) {
            var mv = p[rpPairs[pi].meta];
            var rv = p[rpPairs[pi].real];
            var gap = (rv||0) - (mv||0);
            var gapColor = gap >= 0 ? '#34d399' : '#f87171';
            rpRows += '<td class="text-right meta-color" style="font-size:12px;padding:6px 4px">'+(mv!==undefined?mv:'')+'</td><td class="text-right realizado-color" style="font-size:12px;padding:6px 4px">'+(rv!==undefined?rv:'')+'</td><td class="text-right col-gap" style="font-size:11px;padding:6px 4px;color:'+gapColor+'">'+(gap>0?'+':'')+gap+'</td>';
          }
          rpRows += '</tr>';
        }
        var rpHtml = '<div class="chart-box"><h2>Recuperados por Televendedora <span class="sub">&rarr; Qtdade de clientes recuperados</span></h2><div class="table-wrap"><table><thead><tr><th class="col-ranking" style="font-size:12px">Ranking</th><th style="font-size:12px">Televendedora</th>';
        for (var pi = 0; pi < rpPairs.length; pi++) {
          var mesLabel = rpPairs[pi].meta.replace(' META','');
          rpHtml += '<th class="text-right" style="font-size:11px;padding:6px 4px" title="Meta de clientes recuperados">'+mesLabel+'<br><span style="color:#6b7280">Meta</span></th><th class="text-right" style="font-size:11px;padding:6px 4px" title="Clientes efetivamente recuperados">'+mesLabel+'<br><span style="color:#10b981">Real</span></th><th class="text-right" style="font-size:10px;padding:6px 4px;color:#6b7280" title="Diferença: Realizado − Meta">Gap</th>';
        }
        var rpTotals = '';
        for (var rpi = 0; rpi < rpPairs.length; rpi++) {

      // VALOR POR PROFISSIONAL (appended after recuperados)

        html += vpHtml;
      }

      
      document.getElementById('dashContent').innerHTML = html;
    }

    function renderMonth(monthName) {
      var monthKey = monthName === 'Junho' ? 'Junho' : monthName;
      var pgKey = monthName === 'Junho' ? 'painelGeral' : ('painel' + monthName);
      var pg = (allData[pgKey] && allData[pgKey].recuperacao && allData[pgKey].recuperacao.profissionais && allData[pgKey].recuperacao.profissionais.length > 0) ? allData[pgKey] : null;
      if (!pg) { document.getElementById('dashContent').innerHTML = '<div style="padding:40px;text-align:center;color:#6b7280">Sem dados para ' + monthName + '. Faça upload da planilha.</div>'; return; }

      // Get total faturamento from EVOLUCAO DOS MESES Indicadores row "Valor Recuperado"
      var fatGeral = 0;
      if (allData.evolucaoMeses && allData.evolucaoMeses.indicadores) {
        for (var fi = 0; fi < allData.evolucaoMeses.indicadores.length; fi++) {
          if (allData.evolucaoMeses.indicadores[fi].label === 'Valor Recuperado') {
            fatGeral = allData.evolucaoMeses.indicadores[fi][monthName] || 0;
            break;
          }
        }
      }

      // Build per-profissional faturamento lookup from VALOR RECUPERADO POR MÊS
      var fatLookup = {};
      if (allData.evolucaoMeses && allData.evolucaoMeses.valorPorProf) {
        for (var fi = 0; fi < allData.evolucaoMeses.valorPorProf.length; fi++) {
          var fe = allData.evolucaoMeses.valorPorProf[fi];
          var fk = fe.profissional.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
          fatLookup[fk] = fe[monthName] || 0;
        }
      }

      var profsData = [];
      for (var pi = 0; pi < pg.recuperacao.profissionais.length; pi++) {
        var p = pg.recuperacao.profissionais[pi];
        var name = p.profissional;
        var jMeta = p.meta || 0;
        var jReal = p.realizado || 0;
        // Match faturamento: try full name first, then " - " removed, then base name
        var fullNameKey = name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
        var shortNameKey = name.replace(/\s*-\s*/g,' ').trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
        var baseName = name.split(' - ')[0].trim();
        var baseKey = baseName.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
        var jFat = fatLookup[fullNameKey] || fatLookup[shortNameKey] || fatLookup[baseKey] || 0;
        var jPct = jMeta > 0 ? (jReal / jMeta * 100) : 0;
        profsData.push({
          profissional: name,
          meta: jMeta,
          realizado: jReal,
          pct: jPct,
          faturamento: jFat,
          dias: p.dias
        });
      }

      var totalMeta = pg.recuperacao.total ? pg.recuperacao.total.meta : profsData.reduce(function(s,p){return s+p.meta;},0);
      var totalReal = pg.recuperacao.total ? pg.recuperacao.total.realizado : profsData.reduce(function(s,p){return s+p.realizado;},0);
      var totalPct = totalMeta > 0 ? (totalReal / totalMeta * 100) : 0;

      profsData.sort(function(a,b){return (b.pct||0) - (a.pct||0);});

      var html = '';

      function badge(pct) {
        if (pct >= 100) return '<span class="badge badge-green">Batida ✓</span>';
        if (pct >= 80) return '<span class="badge badge-yellow">Parcial &#9888;</span>';
        return '<span class="badge badge-red">Abaixo &#128308;</span>';
      }

      // Buscar RCA Externo do mês a partir da matriz
      var rcaMat = allData.rcaExterno && allData.rcaExterno.matriz ? allData.rcaExterno.matriz : [];
      var rcaMesData = null;
      for (var rm = 0; rm < rcaMat.length; rm++) {
        if (rcaMat[rm].mes === monthName) { rcaMesData = rcaMat[rm]; break; }
      }
      var hasRCA = !!(rcaMesData && (rcaMesData.clientes > 0 || rcaMesData.faturamento > 0));
      html += '<div class="' + (hasRCA ? 'grid-5' : 'grid-4') + '">';
      html += '<div class="card"><div class="label">' + icn('crosshair',12) + ' Meta Total Televendas</div><div class="value">' + totalMeta + '</div></div>';
      html += '<div class="card"><div class="label">' + (totalReal >= totalMeta ? '&#9989;' : '&#10060;') + ' Realizado Televendas</div><div class="value">' + totalReal + '</div></div>';
      html += '<div class="card"><div class="label">&#x1F4B0; Total Recuperado Televendas</div><div class="value">' + fmtCurr(fatGeral) + '</div></div>';
      html += '<div class="card"><div class="label">' + (totalPct >= 100 ? '&#9989;' : '&#10060;') + ' % Atingido Televendas</div><div class="value">' + totalPct.toFixed(1) + '%</div></div>';
      if (hasRCA) {
        html += '<div class="card"><div class="label" style="color:#f59e0b">' + icn('users',12) + ' RCA Externo &mdash; ' + monthName + '</div><div class="value" style="font-size:24px">' + (rcaMesData.clientes || 0) + ' <span style="font-size:13px;color:#6b7280;font-weight:400">clientes</span></div><div class="sub" style="font-size:18px;font-weight:700;color:#34d399;margin-top:2px">' + fmtCurr(rcaMesData.faturamento || 0) + '</div></div>';
      }
      html += '</div>';

      html += '<div style="display:flex;gap:18px;margin-bottom:18px;flex-wrap:wrap;font-size:13px;color:#6b7280;align-items:center"><span>Legenda:</span><span><span class="badge badge-green">Batida ✓</span> ≥100%</span><span><span class="badge badge-yellow">Parcial &#9888;</span> 80–99%</span><span><span class="badge badge-red">Abaixo &#128308;</span> &lt;80%</span></div>';

      html += '<div class="chart-box"><h2>Desempenho por Televendedora <span class="sub">&rarr; Recupera\u00E7\u00E3o de clientes em ' + monthName + '</span></h2><div class="table-wrap"><table><thead><tr><th class="col-ranking">Ranking</th><th>Televendedora</th><th style="text-align:center">Status</th><th class="text-right meta-color" title="Meta de clientes recuperados">Meta</th><th class="text-right realizado-color" title="Clientes recuperados até o momento">Realizado</th><th class="text-right" title="Percentual de atingimento da meta">%</th><th class="text-right" title="Valor total faturado">Faturamento</th></tr></thead><tbody>';
      for (var i = 0; i < profsData.length; i++) {
        var p = profsData[i];
        var bg = i%2===0?'transparent':'rgba(255,255,255,0.02)';
        var recPct = p.pct;
        var recColor = recPct >= 100 ? '#34d399' : recPct >= 80 ? '#fbbf24' : '#f87171';
        var medal = i === 0 ? '&#x1F947; ' : i === 1 ? '&#x1F948; ' : i === 2 ? '&#x1F949; ' : '';

              csv += (idx+1)+';';
              csv += (cells[1].textContent||'')+';';
              csv += '"'+(cells[2].textContent||'').replace(/"/g,'""')+'";';
              csv += (cells[3].textContent||'').replace(/[R$\s]/g,'')+';';
              csv += (cells[4].textContent||'')+';';
              csv += (cells[5].textContent||'')+';';
              csv += (cells[6].textContent||'')+';';
              csv += (cells[7].textContent||'')+';';
              csv += (cells[8].textContent||'')+'\n';
            });
            var blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url; a.download = 'fila_prioritaria.csv';
            document.body.appendChild(a); a.click();
            document.body.removeChild(a); URL.revokeObjectURL(url);
          });
        }
      }, 50);
    }

    function salvarStorage() {
      try {
        if (!allData || !allData.evolucaoMeses || !allData.painelGeral) return;
        localStorage.setItem('crmData', JSON.stringify(allData));
        localStorage.setItem('crmFileName', document.querySelector('#areaInicial div')?.textContent?.trim() || 'Arquivo');
        localStorage.setItem('crmTimestamp', new Date().toISOString());
      } catch(e) {}
    }

    function restaurarStorage() {
      var saved = localStorage.getItem('crmData');
      if (!saved) return false;
      try {
        var tmp = JSON.parse(saved);
        if (!tmp || !tmp.evolucaoMeses || !tmp.painelGeral) return false;
        // Migrate old saved data to include missing properties
        var mesesPadrao = {painelJulho:1, painelAbril:1, painelMaio:1};
        for (var km in mesesPadrao) {
          if (!tmp[km]) tmp[km] = {recuperacao:{profissionais:[],total:null,faturamentoGeral:0}, metaContatos:{profissionais:[],total:null}, motivos:[], inatividade:[], motivosDiarios:[], rcaExterno:null};
          else if (!tmp[km].rcaExterno) tmp[km].rcaExterno = null;
        }
        if (!tmp.painelGeral) tmp.painelGeral = {recuperacao:{profissionais:[],total:null,faturamentoGeral:0}, metaContatos:{profissionais:[],total:null}, motivos:[], inatividade:[], motivosDiarios:[], rcaExterno:null};
        else if (!tmp.painelGeral.rcaExterno) tmp.painelGeral.rcaExterno = null;
        allData = tmp;
        document.getElementById('areaInicial').parentElement.style.display = 'none';
        var fn = localStorage.getItem('crmFileName') || 'Arquivo';
        var ts = localStorage.getItem('crmTimestamp');
        if (ts) {
          var d = new Date(ts);
          document.getElementById('footer').style.display = 'block';
          document.getElementById('footer').innerHTML = '<strong>' + fn + '</strong> &middot; ' + d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'}) + ' &middot; Painel de Recuperação';
        }
        initTabs();
        switchTab('resumo');
        return true;
      } catch(e) { return false; }
    }

    // Initialize: always fetch fresh data.json, no localStorage
    localStorage.removeItem('crmData');
    localStorage.removeItem('crmFileName');
    localStorage.removeItem('crmTimestamp');
    fetchRemoteData().then(function(remote) {
      if (remote && remote.data && remote.data.evolucaoMeses && remote.data.painelGeral) {
        allData = remote.data;
        document.getElementById('areaInicial').parentElement.style.display = 'none';
        var fn = remote.fileName || 'data.json';
        var ts = remote.updatedAt ? new Date(remote.updatedAt) : new Date();
        document.getElementById('footer').style.display = 'block';
        document.getElementById('footer').innerHTML = '<strong>' + fn + '</strong> &middot; ' + ts.toLocaleDateString('pt-BR') + ' \u00E0s ' + ts.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'}) + ' &middot; Painel de Recupera\u00E7\u00E3o';
        initTabs();
        switchTab('resumo');
        mostrarTokenBtn();
      } else {
        document.getElementById('areaInicial').style.display = 'flex';
      }
    });
  </script>
</body>
</html>
